<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bracket</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a href="/" aria-label="All tournaments">←</a>
    <div class="grow"><h1 id="title">Loading…</h1><div class="sub" id="sub"></div></div>
    <button id="qrBtn">📱 Score on phone</button>
    <button id="fsBtn" title="Fullscreen">⛶</button>
  </header>
  <div class="wrap" style="max-width:none">
    <div id="live"></div>
    <div id="main"></div>
  </div>
  <div class="qr-box" id="qr">
    <img id="qrImg" alt="QR code for the scoring page">
    <div id="qrUrl" style="margin-top:6px;word-break:break-all;max-width:180px"></div>
    <div style="color:#555;margin-top:4px">Scan to score (needs PIN)</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const id = location.pathname.split('/')[2];
    const FORMAT = { single_elim: 'Knockout', round_robin: 'Round robin' };

    T.socket.on('connect', () => T.socket.emit('join', id));
    T.socket.on('deleted', () => { document.getElementById('title').textContent = 'Tournament not found'; document.getElementById('main').innerHTML = '<a href="/">Back to all tournaments</a>'; });

    T.socket.on('state', ({ tournament: t, standings }) => {
      T.setCurrent(t);
      document.title = t.name;
      document.getElementById('title').textContent = t.name;
      const done = t.matches.filter((m) => m.status === 'done').length;
      const total = t.matches.filter((m) => m.status !== 'bye').length;
      document.getElementById('sub').textContent = `${FORMAT[t.format]} · ${t.teams.length} teams · ${T.fmtDuration(t.durationSec)} per match · ${done}/${total} played`;

      const live = t.matches.filter((m) => m.status === 'live');
      document.getElementById('live').innerHTML = live.length
        ? `<div class="section-title">Live now</div><div class="live-strip">${live.map((m) => `
            <div class="live-card">
              <div class="top"><span>${T.esc(T.roundName(t, m.round))}${m.court ? ' · ' + T.esc(m.court) : ''}</span><span class="badge live">LIVE</span></div>
              <div class="teams">
                <div class="tname">${T.esc(T.teamName(t, m.teamA))}</div>
                <div class="big">${m.scoreA} – ${m.scoreB}</div>
                <div class="tname b">${T.esc(T.teamName(t, m.teamB))}</div>
              </div>
              ${T.timerHtml(m)}
            </div>`).join('')}</div>`
        : '';

      document.getElementById('main').innerHTML = t.format === 'single_elim'
        ? `<div class="section-title">Bracket</div>${T.renderBracket(t)}`
        : `<div class="section-title">Standings</div><div class="panel">${T.renderStandings(t, standings)}</div>${T.renderRounds(t)}`;
    });

    // QR code pointing at the scoring page. Uses a LAN address if the page was opened via localhost.
    document.getElementById('qrBtn').addEventListener('click', async () => {
      const box = document.getElementById('qr');
      if (box.classList.toggle('show')) {
        let origin = location.origin;
        if (/localhost|127\.0\.0\.1/.test(location.hostname)) {
          const info = await fetch('/api/info').then((r) => r.json());
          if (info.lan[0]) origin = info.lan[0];
        }
        const url = `${origin}/t/${id}/score`;
        document.getElementById('qrImg').src = '/api/qr?url=' + encodeURIComponent(url);
        document.getElementById('qrUrl').textContent = url;
      }
    });
    document.getElementById('fsBtn').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
    });
  </script>
</body>
</html>
