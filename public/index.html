<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournaments</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top"><h1>🏆 Tournaments</h1><span class="sub">Live brackets, phone scoring, match timers</span></header>
  <div class="wrap">
    <div class="panel">
      <h2 style="font-size:16px;margin-bottom:10px">Tournaments</h2>
      <div id="list" class="t-list"><span class="muted">Loading…</span></div>
    </div>

    <form id="create" class="panel" style="margin-top:16px">
      <h2 style="font-size:16px">New tournament</h2>
      <label for="name">Name</label>
      <input id="name" required maxlength="100" placeholder="e.g. Futsal Cup 2026">
      <div class="grid-2">
        <div>
          <label for="format">Format</label>
          <select id="format">
            <option value="single_elim">Single elimination (knockout)</option>
            <option value="round_robin">Round robin (league)</option>
          </select>
        </div>
        <div>
          <label>Time limit per match</label>
          <div class="row" style="flex-wrap:nowrap">
            <input id="mins" type="number" min="0" max="360" value="10" inputmode="numeric" aria-label="Minutes"><span class="muted">min</span>
            <input id="secs" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="Seconds"><span class="muted">sec</span>
          </div>
        </div>
      </div>
      <label for="teams">Teams, one per line (in seed order for knockouts)</label>
      <textarea id="teams" placeholder="Team Harimau&#10;Team Helang&#10;Team Gajah&#10;Team Rusa"></textarea>
      <label class="row" style="color:var(--text)"><input id="randomize" type="checkbox" style="width:auto"> Shuffle teams randomly</label>
      <div class="row" style="margin-top:14px"><button class="primary" type="submit">Create tournament</button></div>
    </form>
  </div>

  <dialog id="pinDlg">
    <form method="dialog" id="pinForm">
      <h2 style="font-size:16px">Organiser PIN</h2>
      <p class="muted" style="margin:6px 0 0">Needed to create, score and delete. Saved on this device.</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" style="margin-top:12px">
      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/pin.js"></script>
  <script>
    const listEl = document.getElementById('list');
    const FORMAT = { single_elim: 'Knockout', round_robin: 'Round robin' };

    async function loadList() {
      const list = await fetch('/api/tournaments').then((r) => r.json());
      if (!list.length) { listEl.innerHTML = '<span class="muted">No tournaments yet. Create one below.</span>'; return; }
      listEl.innerHTML = list.map((t) => `
        <div class="t-item panel" style="padding:12px">
          <div class="info"><b>${T.esc(t.name)}</b><div class="muted" style="font-size:13px">
            ${FORMAT[t.format]} · ${t.teams} teams · ${T.fmtDuration(t.durationSec)} per match · ${t.done}/${t.total} played
            ${t.live ? ` · <span style="color:var(--live)">${t.live} live</span>` : ''}</div></div>
          <a href="/t/${t.id}"><button>📺 Display</button></a>
          <a href="/t/${t.id}/score"><button class="primary">📱 Score</button></a>
          <button class="danger" data-del="${t.id}" data-name="${T.esc(t.name)}">Delete</button>
        </div>`).join('');
    }
    listEl.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-del]');
      if (!b || !confirm(`Delete "${b.dataset.name}"? This cannot be undone.`)) return;
      if (!(await ensurePin())) return;
      const r = await fetch('/api/tournaments/' + b.dataset.del, { method: 'DELETE', headers: { 'x-pin': T.getPin() } });
      if (!r.ok) T.toast((await r.json()).error || 'Failed');
    });
    T.socket.on('list-changed', loadList);
    loadList();

    document.getElementById('create').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!(await ensurePin())) return;
      const body = {
        name: document.getElementById('name').value,
        format: document.getElementById('format').value,
        durationSec: (+document.getElementById('mins').value || 0) * 60 + (+document.getElementById('secs').value || 0),
        teams: document.getElementById('teams').value.split('\n'),
        randomize: document.getElementById('randomize').checked,
      };
      const r = await fetch('/api/tournaments', { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': T.getPin() }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) return T.toast(j.error || 'Failed');
      location.href = '/t/' + j.id;
    });
  </script>
</body>
</html>
